name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'tests/release.sh'
      - 'tests/release_channels.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: env -u NO_COLOR make check
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/install-release scripts/package-release tests/release.sh
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      CC: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential musl-tools tzdata
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: env -u NO_COLOR cargo test --locked --target '${{ matrix.target }}'
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - run: scripts/package-release '${{ matrix.target }}' 'target/${{ matrix.target }}/release/jobsdone' .scratch/dist
      - run: bash tests/release.sh '.scratch/dist/'*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jobsdone-${{ matrix.target }}
          path: .scratch/dist/*
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: jobsdone-*
          merge-multiple: true
          path: dist
      - name: Verify assets
        working-directory: dist
        run: |
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 2
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          tar -xOf "jobsdone-$RELEASE_TAG-x86_64-unknown-linux-musl.tar.gz" \
            "jobsdone-$RELEASE_TAG-x86_64-unknown-linux-musl/scripts/install-release" > install.sh
          sha256sum install.sh >> SHA256SUMS
      - name: Publish complete release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" = false ]; then
              echo 'Release is already published; leaving its assets unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/install.sh --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi
      - name: Update installation channels
        run: |
          if [[ "$RELEASE_TAG" != *-* ]]; then
            scripts/publish-channel stable "$RELEASE_TAG"
          fi
          scripts/publish-channel beta "$RELEASE_TAG"
