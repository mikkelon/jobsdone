[package]
name = "jobsdone"
version = "0.1.0"
edition = "2024"
description = "A keyboard-first daily task manager for the terminal"
repository = "https://github.com/mikkelon/jobsdone"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29.0"
harper-core = { version = "2.8.0", default-features = false }
jiff = { version = "0.2.35", features = ["serde"] }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
